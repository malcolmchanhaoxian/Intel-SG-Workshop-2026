services:
  tei:
    image: ghcr.io/huggingface/text-embeddings-inference:cpu-1.9
    command: --model-id BAAI/bge-base-en-v1.5
    cpuset: "0-7"
    volumes:
      - ./tei-data:/data
    ports:
      - "8080:80"
    restart: unless-stopped

  db:
    image: postgres:16
    environment:
      POSTGRES_USER: litellm
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: litellm
    volumes:
      - ./pgdata:/var/lib/postgresql/data
    restart: unless-stopped

  litellm:
    # Test deployment reported LiteLLM 1.106.2. Pin this image to a verified
    # matching container tag before production; main-stable is kept here
    # because the exact registry tag naming was not verified during the test.
    image: ghcr.io/berriai/litellm-database:main-stable
    env_file: .env
    command: ["--config", "/app/config.yaml", "--port", "4000"]
    volumes:
      - ./config.yaml:/app/config.yaml
    ports:
      - "4000:4000"
    depends_on:
      - tei
      - db
    restart: unless-stopped
