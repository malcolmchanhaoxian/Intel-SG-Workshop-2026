model_list:
  # BGE embedding model served locally by TEI on Xeon.
  - model_name: bge-embed
    litellm_params:
      model: openai/BAAI/bge-base-en-v1.5
      api_base: http://tei:80/v1
      api_key: none

  # SIMPLE / MEDIUM
  - model_name: default-llm
    litellm_params:
      model: openrouter/nvidia/nemotron-3.5-lightning:free
      api_key: os.environ/OPENROUTER_API_KEY

  # COMPLEX / coding
  - model_name: coder-llm
    litellm_params:
      model: openrouter/cohere/north-mini-code:free
      api_key: os.environ/OPENROUTER_API_KEY

  # REASONING
  - model_name: reasoning-llm
    litellm_params:
      model: openrouter/nvidia/nemotron-3-ultra-550b-a55b:free
      api_key: os.environ/OPENROUTER_API_KEY

  # Single client-facing model name.
  - model_name: smart_router
    litellm_params:
      model: auto_router/complexity_router
      drop_params: true
      complexity_router_config:
        max_tokens_from_tier_model: false
        
        tiers:
          SIMPLE: default-llm
          MEDIUM: default-llm
          COMPLEX: coder-llm
          REASONING: reasoning-llm

        # Hybrid routing: semantic matching using BGE + LiteLLM heuristic fallback.
        semantic_keyword_matching: true
        embedding_model: bge-embed
        match_threshold: 0.7
        keyword_tier_rules:
          - tier: SIMPLE
            keywords:
              - "hello"
              - "what is the capital of France"
              - "summarize this paragraph in one line"
              - "translate this sentence into Malay"
              - "rewrite this email to sound more polite"
              - "explain what a Python decorator does"
              - "explain the difference between Java and JavaScript"
              - "what does this programming function do"
              - "explain this programming concept"
              - "what is an API"
              - "explain how a database index works"

          - tier: COMPLEX
            keywords:
              - "write code to implement"
              - "generate production-ready code"
              - "write a Python function"
              - "implement a new software feature"
              - "build a complete application"
              - "create a REST API"
              - "develop a web application"
              - "write a React component"
              - "implement a backend service"
              - "debug this code"
              - "fix this software bug"
              - "troubleshoot this programming error"
              - "find and fix a bug in this code"
              - "refactor this codebase"
              - "optimise this function"
              - "rewrite this module"
              - "modify the existing source code"
              - "integrate this API into my application"
              - "write unit tests for this implementation"
              - "create automated tests"
              - "implement authentication"
              - "build a database integration"
              - "write a Dockerfile"
              - "create a CI CD pipeline"
              - "implement error handling"
              - "convert this code to another programming language"
              - "review and improve this code"
              - "write a complete software implementation"
              - "generate the files needed for this project"

          - tier: REASONING
            keywords:
              - "compare the trade-offs of three architectures and recommend one"
              - "plan a migration strategy with risks and mitigations"
              - "design a distributed system for a million requests per second"
              - "analyze this business case and build a decision framework"
              - "evaluate multiple system architectures"
              - "design a large-scale distributed architecture"
              - "develop a comprehensive technology strategy"
              - "analyse the trade-offs between competing technical approaches"

      complexity_router_default_model: default-llm

router_settings:
  num_retries: 2
  fallbacks:
    - coder-llm: [reasoning-llm]
    - reasoning-llm: [coder-llm]

general_settings:
  master_key: os.environ/LITELLM_MASTER_KEY
  database_url: os.environ/DATABASE_URL
